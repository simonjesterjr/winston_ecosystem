# Mirror of monolith config/sidekiq_schedule.yml — keep in sync with ecosystem/ai/schedule/manifest.yaml
# Loaded by Sidekiq workers on boot (not by Cromwell).

data_manager:
  daily_data_sync:
    cron: "30 15 * * 1-5 America/Denver"
    class: DailyDataOrchestratorJob
    active_job: true
    queue: default
  weekend_data_sync:
    cron: "0 8 * * 6 America/Denver"
    class: WeekendDataSyncJob
    active_job: true
    queue: default
  quiver_alt_sync:
    cron: "0 16 * * 1-5 America/Denver"
    class: QuiverSyncJob
    active_job: true
    queue: default
  # Independent of Cromwell — alerts if AI/gateway/LLM or monoliths are down.
  ecosystem_health_hourly:
    cron: "10 * * * * America/Denver"
    class: EcosystemHealthCheckJob
    args: ["hourly"]
    active_job: true
    queue: default
  ecosystem_health_daily:
    cron: "5 6 * * * America/Denver"
    class: EcosystemHealthCheckJob
    args: ["daily"]
    active_job: true
    queue: default

winston_v2:
  daily_analysis:
    cron: "30 16 * * 1-5 America/Denver"
    class: DailyAnalysisJob
    active_job: true
    queue: default
  quiver_congress_ls_digest:
    cron: "40 16 * * 1-5 America/Denver"
    class: QuiverCongressLongShortDigestJob
    active_job: true
    queue: default
  quiver_congress_ls_rebalance:
    cron: "45 16 * * 5 America/Denver"
    class: QuiverCongressLongShortRebalanceJob
    active_job: true
    queue: default

winston_unit_test:
  daily_operations:
    cron: "0 6 * * * America/Denver"
    class: DailyOperationsJob
    active_job: true
    queue: default
  active_accounts_backup:
    cron: "0 0 * * * America/Denver"
    class: ActiveAccountsBackupJob
    active_job: true
    queue: default
  quiver_lab_friday_book:
    cron: "0 17 * * 5 America/Denver"
    class: QuiverLabSnapshotJob
    args: ["quiver_house_long_short"]
    active_job: true
    queue: default
  quiver_lab_monday_books:
    cron: "0 8 * * 1 America/Denver"
    class: QuiverLabSnapshotJob
    active_job: true
    queue: default
  portfolio_correlation_daily_score:
    cron: "30 7 * * * America/Denver"
    class: PortfolioCorrelationDailyScoreJob
    active_job: true
    queue: default
  quiver_lab_friday_book:
    cron: "0 17 * * 5 America/Denver"
    class: QuiverLabSnapshotJob
    active_job: true
    queue: default