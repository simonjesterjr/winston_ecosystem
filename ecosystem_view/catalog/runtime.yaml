# Intended compose topology for Winston Ecosystem View (poster source).
# Regenerated by humans when compose.yml changes. Not live metrics.
# Short names are first-class: wv2, wut, dm, bg. AI is not a fifth monolith.

legend:
  wv2: winston_v2
  wut: winston_unit_test
  dm: data_manager
  bg: broker_gateway
  ai: Cromwell runtime (compose profile ai) — not a majestic monolith
  infra: shared redis / host processes

orchestration:
  canonical: compose.yml
  wrapper: bin/compose
  stale:
    - ecosystem/deployment/compose.yml
    - winston_unit_test/docker-compose.yml

stores:
  - id: redis
    parent: infra
    kind: redis
    image: redis:7-alpine
    host_port: 6379
    isolation: "db index per monolith: dm/0 wut/1 wv2/2 bg/3"
  - id: parquet_lake
    parent: dm
    kind: volume
    volume: sawtooth_dm_data
    mounts:
      data_manager: /app/data
      winston_unit_test: /dm_data:ro
      winston_v2: /dm_data:ro
  - id: bg_evidence
    parent: bg
    kind: volume
    volume: sawtooth_bg_evidence
    mounts:
      broker_gateway: /app/data/evidence

externals:
  - id: eodhd
    kind: vendor
    owner: dm
    env_file: ecosystem/deployment/eodhd.env
  - id: quiver
    kind: vendor
    owner: dm
    note: env template exists; not a compose service
  - id: ibkr_cpgw
    kind: host_process
    owner: bg
    base: https://host.docker.internal:5000/v1/api
    note: not a compose container
  - id: schwab
    kind: adapter
    owner: bg
    note: no compose service

absent:
  - hdf5
  - s3_minio
  - otel_collector
  - codescene
  - dragonruby
  - fossflow
  - k8s
  - systemd_units

containers:
  - name: redis
    parent: infra
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: true
  - name: postgres
    parent: dm
    image: postgres:16
    ports: ["5432:5432"]
    healthcheck: true
    db: data_manager_development
  - name: wut_postgres
    parent: wut
    image: postgres:16
    ports: ["5433:5432"]
    healthcheck: true
    db: winston_unit_test_dev
  - name: wv2_postgres
    parent: wv2
    image: postgres:16
    ports: ["5434:5432"]
    healthcheck: true
    db: winston_v2_dev
  - name: bg_postgres
    parent: bg
    image: postgres:16
    ports: ["5435:5432"]
    healthcheck: true
    db: broker_gateway_dev
  - name: data_manager
    parent: dm
    build: data_manager/Containerfile
    ports: ["3001:3000"]
    command: rails server
    redis_db: 0
  - name: data_manager_sidekiq
    parent: dm
    build: data_manager/Containerfile
    command: sidekiq
    redis_db: 0
  - name: winston_unit_test
    parent: wut
    build: winston_unit_test/Containerfile
    ports: ["3000:3000"]
    command: rails server
    redis_db: 1
  - name: winston_unit_test_sidekiq
    parent: wut
    build: winston_unit_test/Containerfile
    command: sidekiq
    redis_db: 1
  - name: winston_v2
    parent: wv2
    build: winston_v2/Containerfile
    ports: ["3002:3000"]
    command: rails server
    redis_db: 2
  - name: winston_v2_sidekiq
    parent: wv2
    build: winston_v2/Containerfile
    command: sidekiq
    redis_db: 2
  - name: broker_gateway
    parent: bg
    build: broker_gateway/Containerfile
    ports: ["3003:3000"]
    command: rails server
    redis_db: 3
  - name: broker_gateway_sidekiq
    parent: bg
    build: broker_gateway/Containerfile
    command: sidekiq
    redis_db: 3
  - name: ollama
    parent: ai
    profile: ai
    image: docker.io/ollama/ollama:latest
    healthcheck: true
  - name: open-webui
    parent: ai
    profile: ai
    image: ghcr.io/open-webui/open-webui:main
    ports: ["127.0.0.1:8080:8080"]
  - name: winston_mcp
    parent: ai
    profile: ai
    build: ecosystem/ai/mcp/Containerfile
    expose: [8088]
  - name: nanobot_cromwell
    parent: ai
    profile: ai
    build: ecosystem/ai/nanobot/Containerfile
    ports: ["127.0.0.1:18790:18790"]

edges:
  - from: dm
    to: eodhd
    kind: http
    adr: ADR-002
  - from: dm
    to: parquet_lake
    kind: file
    adr: ADR-002
  - from: dm
    to: wut
    kind: webhook
    note: data_ready / parquet mount
  - from: dm
    to: wv2
    kind: webhook
    note: data_ready / parquet mount
  - from: wut
    to: wv2
    kind: file
    note: portfolio_configs JSON handoff
  - from: wut
    to: wv2
    kind: http
    note: PCS snapshots (ADR-007)
  - from: wv2
    to: bg
    kind: http
    note: Confirmation Intake; fail closed
    adr: ADR-009
  - from: bg
    to: ibkr_cpgw
    kind: http
  - from: bg
    to: schwab
    kind: http
    note: adapter; write mostly off
  - from: wv2
    to: winston_mcp
    kind: http
    note: /internal APIs
  - from: winston_mcp
    to: nanobot_cromwell
    kind: sse
